name: Unity Android build

# Manually triggered Unity build using GameCI (https://game.ci). Requires repository secrets:
#   UNITY_LICENSE (or UNITY_SERIAL), UNITY_EMAIL, UNITY_PASSWORD
# Optional release signing secrets (base64 keystore + passwords):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS, ANDROID_KEY_PASS
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "Build kind"
        required: true
        default: "BuildDebugApk"
        type: choice
        options: [BuildDebugApk, BuildReleaseApk, BuildReleaseAab]

jobs:
  editmode-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Packages/manifest.json') }}
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

  android:
    needs: editmode-tests
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json') }}
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > release.keystore
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          CUBECLASH_KEYSTORE_PATH: release.keystore
          CUBECLASH_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          CUBECLASH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CUBECLASH_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          CUBECLASH_VERSION_CODE: ${{ github.run_number }}
        with:
          targetPlatform: Android
          buildMethod: CubeSnake.EditorTools.BuildScript.${{ inputs.kind }}
      - uses: actions/upload-artifact@v4
        with:
          name: cubeclash-android-${{ inputs.kind }}
          path: Builds/Android
