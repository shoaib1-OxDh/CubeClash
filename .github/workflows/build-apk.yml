name: Build APK

# Builds Cube Clash on every push: runs the engine tests, then builds an installable debug APK and an optimised
# release APK (signed with the debug key unless release signing secrets are configured). No licences or secrets
# are needed. Download the APKs from the run's "Artifacts" section.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      APP_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Prepare Gradle wrapper
        run: |
          test -f gradlew || { echo "::error::gradlew not found at the repository root."; exit 1; }
          test -f gradle/wrapper/gradle-wrapper.jar || { echo "::error::gradle/wrapper/gradle-wrapper.jar is missing."; exit 1; }
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The default ("tools platform-tools") fails: the legacy "tools" package no longer exists.
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run engine tests
        run: ./gradlew :engine:test --stacktrace 2>&1 | tee engine.log; exit ${PIPESTATUS[0]}

      - name: Optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > cubeclash-release.jks
            printf 'storeFile=cubeclash-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "Release APK will be signed with the release keystore."
          else
            echo "No KEYSTORE_BASE64 secret: the release APK is signed with the debug key (fine for installing and testing)."
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee assemble.log; exit ${PIPESTATUS[0]}

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee release.log; exit ${PIPESTATUS[0]}

      - name: Name the APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/CubeClash-1.0.${APP_BUILD_NUMBER}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "out/CubeClash-1.0.${APP_BUILD_NUMBER}.apk"
          ls -la out

      - name: Summarise failures
        if: failure()
        run: |
          grep -h -E '^e: |FAILED|AssertionError|Exception:|error:' *.log | grep -v '^\s*at ' | head -60 || true

      - name: Remove signing files
        if: always()
        run: rm -f cubeclash-release.jks keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: CubeClash-apk-${{ github.run_number }}
          path: out/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          if-no-files-found: warn
          path: engine/build/reports/tests/
