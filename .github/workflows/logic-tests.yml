name: Logic tests

# Runs the engine-independent gameplay tests (merging, scoring, chain path following, combat, AI, saves and a
# long-session arena soak test) without needing a Unity licence.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run tests
        run: dotnet test tools/LogicTests --logger "console;verbosity=normal"
